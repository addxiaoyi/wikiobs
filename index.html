<html lang="zh-CN" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        color-scheme: dark;
        --background: 240 10% 4%;
        --foreground: 0 0% 98%;

      .light {

        --gen-100: 222.2 84% 4.9%;

      }
      html.dark, body.dark {
        background-color: #0e1015;
        color: #f8fafc;
      }
      html.light, body.light {
        background-color: #ffffff;
        color: #1e2025;
      }
      #root {

        height: 100%;
        width: 100%;
      }
